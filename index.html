<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Utility Hub — Scheduler + Nutrition Analyzer</title>
<style>
:root {
    --bg:#0b1020;
    --panel:#121a2d;
    --panel2:#18223a;
    --text:#eef3ff;
    --muted:#9ba8c7;
    --accent:#6ea8fe;
    --border:#293653;
}
* { box-sizing:border-box; }
html,body { margin:0; min-height:100%; }
body {
    font-family:Inter,Segoe UI,Arial,sans-serif;
    background:linear-gradient(135deg,#080c18,#10182c);
    color:var(--text);
}
.hub-header {
    padding:20px;
    border-bottom:1px solid var(--border);
    background:rgba(10,15,29,.96);
    position:sticky;
    top:0;
    z-index:20;
}
.hub-title {
    max-width:1400px;
    margin:0 auto 14px;
}
.hub-title h1 { margin:0 0 4px; font-size:25px; }
.hub-title p { margin:0; color:var(--muted); font-size:13px; }
.hub-tabs {
    max-width:1400px;
    margin:auto;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}
.hub-tab {
    border:1px solid var(--border);
    background:var(--panel);
    color:var(--text);
    padding:13px 16px;
    border-radius:11px;
    cursor:pointer;
    font-weight:700;
    font-size:15px;
}
.hub-tab.active {
    background:var(--accent);
    color:white;
    border-color:var(--accent);
}
.hub-content {
    max-width:1400px;
    margin:0 auto;
    padding:14px;
}
.hub-panel { display:none; }
.hub-panel.active { display:block; }
.hub-frame {
    width:100%;
    height:calc(100vh - 150px);
    min-height:700px;
    border:1px solid var(--border);
    border-radius:14px;
    background:white;
    display:block;
}
@media(max-width:700px) {
    .hub-header { padding:13px; }
    .hub-title h1 { font-size:20px; }
    .hub-content { padding:7px; }
    .hub-frame { min-height:800px; height:calc(100vh - 145px); border-radius:10px; }
}
</style>
</head>
<body>

<header class="hub-header">
    <div class="hub-title">
        <h1>⚡ Smart Utility Hub</h1>
        <p>Use the activity scheduler and food & nutrition analyzer from one HTML file.</p>
    </div>

    <div class="hub-tabs">
        <button class="hub-tab active" data-panel="schedulerPanel" onclick="switchTool('schedulerPanel', this)">
            📅 Smart Activity Scheduler
        </button>
        <button class="hub-tab" data-panel="nutritionPanel" onclick="switchTool('nutritionPanel', this)">
            🥗 Food & Nutrition Analyzer
        </button>
    </div>
</header>

<main class="hub-content">
    <section id="schedulerPanel" class="hub-panel active">
        <iframe id="schedulerFrame" class="hub-frame" title="Smart Activity Scheduler"></iframe>
    </section>

    <section id="nutritionPanel" class="hub-panel">
        <iframe id="nutritionFrame" class="hub-frame" title="Smart Food & Nutrition Analyzer"></iframe>
    </section>
</main>

<script>
const schedulerCode = "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>Smart Activity Scheduler<\/title>\n\n<!-- FullCalendar -->\n<script src=\"https://cdn.jsdelivr.net/npm/fullcalendar@7.1.0/index.global.min.js\"><\/script>\n\n<style>\n:root{\n    --bg:#0b1020;\n    --panel:#121a2d;\n    --panel2:#18223a;\n    --text:#eef3ff;\n    --muted:#9ba8c7;\n    --accent:#6ea8fe;\n    --success:#3ddc97;\n    --warning:#ffc857;\n    --danger:#ff6b6b;\n    --border:#293653;\n    --shadow:0 12px 35px rgba(0,0,0,.25);\n}\n\n*{\n    box-sizing:border-box;\n}\n\nbody{\n    margin:0;\n    font-family:Inter,Segoe UI,Arial,sans-serif;\n    background:linear-gradient(135deg,#080c18,#10182c);\n    color:var(--text);\n}\n\nbutton,input,select{\n    font:inherit;\n}\n\nbutton{\n    cursor:pointer;\n}\n\n.app{\n    display:grid;\n    grid-template-columns:340px 1fr;\n    min-height:100vh;\n}\n\n/* SIDEBAR */\n\n.sidebar{\n    padding:22px;\n    background:rgba(10,15,29,.96);\n    border-right:1px solid var(--border);\n    overflow-y:auto;\n}\n\n.logo{\n    font-size:24px;\n    font-weight:800;\n    margin-bottom:5px;\n}\n\n.subtitle{\n    color:var(--muted);\n    font-size:13px;\n    margin-bottom:25px;\n}\n\n.section{\n    margin-bottom:22px;\n}\n\n.section-title{\n    font-size:12px;\n    text-transform:uppercase;\n    color:var(--muted);\n    letter-spacing:1px;\n    margin-bottom:10px;\n}\n\nlabel{\n    display:block;\n    margin-bottom:7px;\n    font-size:13px;\n    color:#cbd5ee;\n}\n\ninput,select{\n    width:100%;\n    padding:11px 12px;\n    margin-bottom:13px;\n    border-radius:10px;\n    border:1px solid var(--border);\n    background:var(--panel);\n    color:var(--text);\n    outline:none;\n}\n\ninput:focus,select:focus{\n    border-color:var(--accent);\n}\n\n.row{\n    display:grid;\n    grid-template-columns:1fr 1fr;\n    gap:10px;\n}\n\n.btn{\n    border:0;\n    border-radius:10px;\n    padding:12px 14px;\n    color:white;\n    background:var(--accent);\n    font-weight:700;\n    width:100%;\n}\n\n.btn:hover{\n    filter:brightness(1.1);\n}\n\n.btn.secondary{\n    background:var(--panel2);\n    border:1px solid var(--border);\n}\n\n.btn.danger{\n    background:var(--danger);\n}\n\n.btn.success{\n    background:var(--success);\n    color:#062518;\n}\n\n.button-row{\n    display:grid;\n    grid-template-columns:1fr 1fr;\n    gap:8px;\n}\n\n.priority-preview{\n    display:flex;\n    gap:7px;\n    flex-wrap:wrap;\n}\n\n.priority{\n    padding:5px 9px;\n    border-radius:20px;\n    font-size:11px;\n    font-weight:700;\n}\n\n.low{\n    background:rgba(61,220,151,.15);\n    color:var(--success);\n}\n\n.medium{\n    background:rgba(255,200,87,.15);\n    color:var(--warning);\n}\n\n.high{\n    background:rgba(255,130,80,.15);\n    color:#ff9b70;\n}\n\n.urgent{\n    background:rgba(255,107,107,.15);\n    color:var(--danger);\n}\n\n/* MAIN */\n\n.main{\n    padding:20px;\n    min-width:0;\n}\n\n.topbar{\n    display:flex;\n    justify-content:space-between;\n    align-items:center;\n    gap:15px;\n    margin-bottom:18px;\n}\n\n.topbar h1{\n    margin:0;\n    font-size:27px;\n}\n\n.top-actions{\n    display:flex;\n    gap:8px;\n}\n\n.small-btn{\n    padding:9px 12px;\n    border:1px solid var(--border);\n    background:var(--panel);\n    color:var(--text);\n    border-radius:9px;\n}\n\n.stats{\n    display:grid;\n    grid-template-columns:repeat(4,1fr);\n    gap:12px;\n    margin-bottom:18px;\n}\n\n.stat{\n    background:var(--panel);\n    border:1px solid var(--border);\n    border-radius:14px;\n    padding:16px;\n    box-shadow:var(--shadow);\n}\n\n.stat-number{\n    font-size:25px;\n    font-weight:800;\n}\n\n.stat-label{\n    color:var(--muted);\n    font-size:12px;\n}\n\n.workspace{\n    background:var(--panel);\n    border:1px solid var(--border);\n    border-radius:15px;\n    padding:15px;\n    box-shadow:var(--shadow);\n}\n\n#calendar{\n    min-height:650px;\n}\n\n/* ACTIVITY LIST */\n\n.activity-panel{\n    margin-top:18px;\n}\n\n.activity-header{\n    display:flex;\n    justify-content:space-between;\n    align-items:center;\n    margin-bottom:10px;\n}\n\n.activity-list{\n    display:grid;\n    gap:9px;\n}\n\n.activity-card{\n    display:grid;\n    grid-template-columns:auto 1fr auto;\n    gap:12px;\n    align-items:center;\n    padding:13px;\n    border:1px solid var(--border);\n    background:var(--panel2);\n    border-radius:12px;\n}\n\n.activity-card.completed{\n    opacity:.55;\n}\n\n.activity-dot{\n    width:10px;\n    height:10px;\n    border-radius:50%;\n}\n\n.activity-name{\n    font-weight:750;\n}\n\n.activity-meta{\n    color:var(--muted);\n    font-size:12px;\n    margin-top:3px;\n}\n\n.card-actions{\n    display:flex;\n    gap:6px;\n}\n\n.icon-btn{\n    border:1px solid var(--border);\n    background:var(--panel);\n    color:var(--text);\n    border-radius:8px;\n    padding:7px 9px;\n}\n\n/* MODAL */\n\n.modal{\n    display:none;\n    position:fixed;\n    inset:0;\n    background:rgba(0,0,0,.65);\n    z-index:1000;\n    align-items:center;\n    justify-content:center;\n    padding:20px;\n}\n\n.modal.show{\n    display:flex;\n}\n\n.modal-box{\n    width:min(520px,100%);\n    max-height:90vh;\n    overflow:auto;\n    background:var(--panel);\n    border:1px solid var(--border);\n    border-radius:16px;\n    padding:22px;\n}\n\n.modal-title{\n    margin-top:0;\n}\n\n.toast{\n    position:fixed;\n    right:20px;\n    bottom:20px;\n    background:#18223a;\n    border:1px solid var(--border);\n    color:white;\n    padding:12px 16px;\n    border-radius:10px;\n    display:none;\n    z-index:2000;\n}\n\n.toast.show{\n    display:block;\n}\n\n/* MOBILE */\n\n@media(max-width:950px){\n    .app{\n        grid-template-columns:1fr;\n    }\n\n    .sidebar{\n        border-right:0;\n        border-bottom:1px solid var(--border);\n    }\n\n    .stats{\n        grid-template-columns:repeat(2,1fr);\n    }\n}\n\n@media(max-width:600px){\n    .main{\n        padding:12px;\n    }\n\n    .stats{\n        grid-template-columns:1fr 1fr;\n    }\n\n    .topbar{\n        flex-direction:column;\n        align-items:flex-start;\n    }\n\n    .activity-card{\n        grid-template-columns:auto 1fr;\n    }\n\n    .card-actions{\n        grid-column:2;\n    }\n}\n<\/style>\n<\/head>\n\n<body>\n\n<div class=\"app\">\n\n<!-- ================= SIDEBAR ================= -->\n\n<aside class=\"sidebar\">\n\n<div class=\"logo\">⚡ Smart Scheduler<\/div>\n<div class=\"subtitle\">\nTurn your activities into an organized schedule automatically.\n<\/div>\n\n<div class=\"section\">\n\n<div class=\"section-title\">Activity information<\/div>\n\n<label>Activity name<\/label>\n<input id=\"activityName\" type=\"text\"\nplaceholder=\"e.g. Physics revision\">\n\n<div class=\"row\">\n\n<div>\n<label>Start date<\/label>\n<input id=\"startDate\" type=\"date\">\n<\/div>\n\n<div>\n<label>End date<\/label>\n<input id=\"endDate\" type=\"date\">\n<\/div>\n\n<\/div>\n\n<label>Required time<\/label>\n<select id=\"duration\">\n<option value=\"30\">30 minutes<\/option>\n<option value=\"45\">45 minutes<\/option>\n<option value=\"60\" selected>1 hour<\/option>\n<option value=\"90\">1.5 hours<\/option>\n<option value=\"120\">2 hours<\/option>\n<option value=\"150\">2.5 hours<\/option>\n<option value=\"180\">3 hours<\/option>\n<option value=\"240\">4 hours<\/option>\n<option value=\"custom\">Custom<\/option>\n<\/select>\n\n<div id=\"customDurationBox\" style=\"display:none;\">\n<label>Custom duration (minutes)<\/label>\n<input id=\"customDuration\" type=\"number\" min=\"5\" value=\"60\">\n<\/div>\n\n<\/div>\n\n<div class=\"section\">\n\n<div class=\"section-title\">Preferred time<\/div>\n\n<div class=\"row\">\n\n<div>\n<label>Start time<\/label>\n<input id=\"preferredStart\" type=\"time\" value=\"07:00\">\n<\/div>\n\n<div>\n<label>End time<\/label>\n<input id=\"preferredEnd\" type=\"time\" value=\"23:00\">\n<\/div>\n\n<\/div>\n\n<\/div>\n\n<div class=\"section\">\n\n<div class=\"section-title\">Priority<\/div>\n\n<select id=\"priority\">\n<option value=\"low\">Low<\/option>\n<option value=\"medium\" selected>Medium<\/option>\n<option value=\"high\">High<\/option>\n<option value=\"urgent\">Urgent<\/option>\n<\/select>\n\n<\/div>\n\n<div class=\"section\">\n\n<div class=\"section-title\">Scheduling mode<\/div>\n\n<select id=\"scheduleMode\">\n<option value=\"smart\">Smart automatic scheduling<\/option>\n<option value=\"earliest\">Earliest available slot<\/option>\n<option value=\"latest\">Latest available slot<\/option>\n<\/select>\n\n<\/div>\n\n<button class=\"btn\" onclick=\"addActivity()\">\n＋ Add Activity\n<\/button>\n\n<div style=\"height:8px\"><\/div>\n\n<div class=\"button-row\">\n\n<button class=\"btn secondary\" onclick=\"generateSchedule()\">\n⚡ Generate\n<\/button>\n\n<button class=\"btn secondary\" onclick=\"clearAll()\">\nClear\n<\/button>\n\n<\/div>\n\n<div style=\"height:20px\"><\/div>\n\n<div class=\"section\">\n\n<div class=\"section-title\">Data<\/div>\n\n<div class=\"button-row\">\n\n<button class=\"small-btn\" onclick=\"exportData()\">\nExport\n<\/button>\n\n<button class=\"small-btn\" onclick=\"document.getElementById('importFile').click()\">\nImport\n<\/button>\n\n<\/div>\n\n<input id=\"importFile\"\ntype=\"file\"\naccept=\".json\"\nstyle=\"display:none\"\nonchange=\"importData(event)\">\n\n<\/div>\n\n<\/aside>\n\n\n<!-- ================= MAIN ================= -->\n\n<main class=\"main\">\n\n<div class=\"topbar\">\n\n<div>\n<h1>My Schedule<\/h1>\n<div style=\"color:var(--muted);font-size:13px\">\nManage your activities in one place\n<\/div>\n<\/div>\n\n<div class=\"top-actions\">\n\n<button class=\"small-btn\" onclick=\"todayView()\">\nToday\n<\/button>\n\n<button class=\"small-btn\" onclick=\"toggleTheme()\">\n◐ Theme\n<\/button>\n\n<\/div>\n\n<\/div>\n\n\n<div class=\"stats\">\n\n<div class=\"stat\">\n<div class=\"stat-number\" id=\"totalStat\">0<\/div>\n<div class=\"stat-label\">Total activities<\/div>\n<\/div>\n\n<div class=\"stat\">\n<div class=\"stat-number\" id=\"pendingStat\">0<\/div>\n<div class=\"stat-label\">Pending<\/div>\n<\/div>\n\n<div class=\"stat\">\n<div class=\"stat-number\" id=\"completedStat\">0<\/div>\n<div class=\"stat-label\">Completed<\/div>\n<\/div>\n\n<div class=\"stat\">\n<div class=\"stat-number\" id=\"hoursStat\">0h<\/div>\n<div class=\"stat-label\">Scheduled time<\/div>\n<\/div>\n\n<\/div>\n\n\n<div class=\"workspace\">\n<div id=\"calendar\"><\/div>\n<\/div>\n\n\n<div class=\"activity-panel\">\n\n<div class=\"activity-header\">\n\n<h3>Activities<\/h3>\n\n<select id=\"filterPriority\"\nonchange=\"renderActivityList()\"\nstyle=\"width:160px;margin:0\">\n\n<option value=\"all\">All priorities<\/option>\n<option value=\"urgent\">Urgent<\/option>\n<option value=\"high\">High<\/option>\n<option value=\"medium\">Medium<\/option>\n<option value=\"low\">Low<\/option>\n\n<\/select>\n\n<\/div>\n\n<div id=\"activityList\" class=\"activity-list\"><\/div>\n\n<\/div>\n\n<\/main>\n\n<\/div>\n\n\n<!-- ================= EDIT MODAL ================= -->\n\n<div id=\"editModal\" class=\"modal\">\n\n<div class=\"modal-box\">\n\n<h2 class=\"modal-title\">Edit Activity<\/h2>\n\n<input type=\"hidden\" id=\"editId\">\n\n<label>Activity name<\/label>\n<input id=\"editName\">\n\n<div class=\"row\">\n\n<div>\n<label>Date<\/label>\n<input id=\"editDate\" type=\"date\">\n<\/div>\n\n<div>\n<label>Start time<\/label>\n<input id=\"editStart\" type=\"time\">\n<\/div>\n\n<\/div>\n\n<div class=\"row\">\n\n<div>\n<label>Duration (minutes)<\/label>\n<input id=\"editDuration\" type=\"number\" min=\"5\">\n<\/div>\n\n<div>\n<label>Priority<\/label>\n<select id=\"editPriority\">\n<option value=\"low\">Low<\/option>\n<option value=\"medium\">Medium<\/option>\n<option value=\"high\">High<\/option>\n<option value=\"urgent\">Urgent<\/option>\n<\/select>\n<\/div>\n\n<\/div>\n\n<div class=\"button-row\">\n\n<button class=\"btn success\" onclick=\"saveEdit()\">\nSave\n<\/button>\n\n<button class=\"btn secondary\" onclick=\"closeModal()\">\nCancel\n<\/button>\n\n<\/div>\n\n<\/div>\n\n<\/div>\n\n\n<div id=\"toast\" class=\"toast\"><\/div>\n\n\n<script>\n\n/* =========================================================\n   SMART SCHEDULER\n   ========================================================= */\n\nlet activities =\nJSON.parse(localStorage.getItem(\"smartSchedulerActivities\") || \"[]\");\n\nlet calendar;\n\n\n/* =========================================================\n   INITIALIZATION\n   ========================================================= */\n\ndocument.addEventListener(\"DOMContentLoaded\", () => {\n\n    const today = new Date();\n    const iso = toISODate(today);\n\n    document.getElementById(\"startDate\").value = iso;\n    document.getElementById(\"endDate\").value = iso;\n\n    initializeCalendar();\n    updateUI();\n\n});\n\n\n/* =========================================================\n   CALENDAR\n   ========================================================= */\n\nfunction initializeCalendar(){\n\n    const calendarEl = document.getElementById(\"calendar\");\n\n    calendar = new FullCalendar.Calendar(calendarEl, {\n\n        initialView:\"timeGridWeek\",\n\n        height:\"auto\",\n\n        nowIndicator:true,\n\n        editable:true,\n\n        selectable:true,\n\n        eventResizableFromStart:true,\n\n        headerToolbar:{\n            left:\"prev,next today\",\n            center:\"title\",\n            right:\"dayGridMonth,timeGridWeek,timeGridDay,listWeek\"\n        },\n\n        events:getCalendarEvents(),\n\n        eventClick:function(info){\n\n            const id = info.event.extendedProps.activityId;\n\n            openEdit(id);\n\n        },\n\n        eventDrop:function(info){\n\n            const id =\n                info.event.extendedProps.activityId;\n\n            const activity =\n                activities.find(a => a.id === id);\n\n            if(!activity)return;\n\n            activity.date =\n                toISODate(info.event.start);\n\n            activity.start =\n                formatTime(info.event.start);\n\n            saveData();\n\n            showToast(\"Activity rescheduled\");\n\n            updateUI();\n\n        },\n\n        eventResize:function(info){\n\n            const id =\n                info.event.extendedProps.activityId;\n\n            const activity =\n                activities.find(a => a.id === id);\n\n            if(!activity)return;\n\n            const start = info.event.start;\n            const end = info.event.end;\n\n            activity.date =\n                toISODate(start);\n\n            activity.start =\n                formatTime(start);\n\n            activity.duration =\n                Math.max(\n                    5,\n                    Math.round(\n                        (end-start)/60000\n                    )\n                );\n\n            saveData();\n\n            showToast(\"Duration updated\");\n\n            updateUI();\n\n        }\n\n    });\n\n    calendar.render();\n\n}\n\n\n/* =========================================================\n   ADD ACTIVITY\n   ========================================================= */\n\nfunction addActivity(){\n\n    const name =\n        document.getElementById(\"activityName\").value.trim();\n\n    const startDate =\n        document.getElementById(\"startDate\").value;\n\n    const endDate =\n        document.getElementById(\"endDate\").value;\n\n    const priority =\n        document.getElementById(\"priority\").value;\n\n    const preferredStart =\n        document.getElementById(\"preferredStart\").value;\n\n    const preferredEnd =\n        document.getElementById(\"preferredEnd\").value;\n\n    const durationSelect =\n        document.getElementById(\"duration\").value;\n\n    let duration;\n\n    if(durationSelect === \"custom\"){\n\n        duration =\n            parseInt(\n                document.getElementById(\"customDuration\").value\n            );\n\n    }else{\n\n        duration =\n            parseInt(durationSelect);\n\n    }\n\n\n    if(!name){\n\n        showToast(\"Enter an activity name\");\n\n        return;\n\n    }\n\n\n    if(!startDate || !endDate){\n\n        showToast(\"Select the date range\");\n\n        return;\n\n    }\n\n\n    if(new Date(endDate) < new Date(startDate)){\n\n        showToast(\"End date cannot be before start date\");\n\n        return;\n\n    }\n\n\n    if(!duration || duration < 5){\n\n        showToast(\"Enter a valid duration\");\n\n        return;\n\n    }\n\n\n    if(\n        timeToMinutes(preferredEnd) <=\n        timeToMinutes(preferredStart)\n    ){\n\n        showToast(\"End time must be after start time\");\n\n        return;\n\n    }\n\n\n    const activity = {\n\n        id:\n            crypto.randomUUID\n            ? crypto.randomUUID()\n            : Date.now().toString(),\n\n        name,\n\n        rangeStart:startDate,\n\n        rangeEnd:endDate,\n\n        duration,\n\n        priority,\n\n        preferredStart,\n\n        preferredEnd,\n\n        completed:false,\n\n        scheduled:false,\n\n        date:null,\n\n        start:null\n\n    };\n\n\n    activities.push(activity);\n\n    saveData();\n\n    generateSchedule();\n\n    clearForm();\n\n    showToast(\"Activity added\");\n\n}\n\n\n/* =========================================================\n   SMART SCHEDULING ENGINE\n   ========================================================= */\n\nfunction generateSchedule(){\n\n    if(!activities.length){\n\n        showToast(\"Add activities first\");\n\n        return;\n\n    }\n\n\n    /*\n       Priority weights.\n       Higher number = scheduled earlier.\n    */\n\n    const priorityWeight = {\n\n        urgent:4,\n        high:3,\n        medium:2,\n        low:1\n\n    };\n\n\n    /*\n       Schedule unscheduled + scheduled activities together.\n       This makes regeneration deterministic.\n    */\n\n    const sorted =\n        [...activities].sort((a,b)=>{\n\n            const priorityDifference =\n                priorityWeight[b.priority] -\n                priorityWeight[a.priority];\n\n            if(priorityDifference !== 0)\n                return priorityDifference;\n\n            return a.duration-b.duration;\n\n        });\n\n\n    /*\n       Existing scheduled blocks are cleared.\n       Completed activities are preserved.\n    */\n\n    activities.forEach(a=>{\n\n        if(!a.completed){\n\n            a.scheduled=false;\n            a.date=null;\n            a.start=null;\n\n        }\n\n    });\n\n\n    const occupied = {};\n\n\n    for(const activity of sorted){\n\n        if(activity.completed)\n            continue;\n\n\n        const startDate =\n            parseDate(activity.rangeStart);\n\n        const endDate =\n            parseDate(activity.rangeEnd);\n\n\n        let scheduled = false;\n\n\n        /*\n           Search each allowed date.\n        */\n\n        for(\n            let day = new Date(startDate);\n            day <= endDate;\n            day.setDate(day.getDate()+1)\n        ){\n\n            const dateString =\n                toISODate(day);\n\n            const startMinutes =\n                timeToMinutes(activity.preferredStart);\n\n            const endMinutes =\n                timeToMinutes(activity.preferredEnd);\n\n\n            const slots =\n                findAvailableSlots(\n                    dateString,\n                    startMinutes,\n                    endMinutes,\n                    activity.duration,\n                    occupied\n                );\n\n\n            if(slots.length){\n\n                let chosen;\n\n                const mode =\n                    document.getElementById(\"scheduleMode\").value;\n\n\n                if(mode === \"latest\"){\n\n                    chosen =\n                        slots[slots.length-1];\n\n                }else{\n\n                    chosen =\n                        slots[0];\n\n                }\n\n\n                activity.date =\n                    dateString;\n\n                activity.start =\n                    minutesToTime(chosen.start);\n\n                activity.scheduled = true;\n\n\n                addOccupied(\n                    occupied,\n                    dateString,\n                    chosen.start,\n                    chosen.start + activity.duration\n                );\n\n\n                scheduled=true;\n\n                break;\n\n            }\n\n        }\n\n\n        if(!scheduled){\n\n            activity.scheduled=false;\n\n        }\n\n    }\n\n\n    saveData();\n\n    refreshCalendar();\n\n    updateUI();\n\n\n    const unscheduled =\n        activities.filter(\n            a => !a.completed && !a.scheduled\n        ).length;\n\n\n    if(unscheduled){\n\n        showToast(\n            `${unscheduled} activity could not fit in the selected time ranges`\n        );\n\n    }else{\n\n        showToast(\"Schedule generated successfully\");\n\n    }\n\n}\n\n\n/* =========================================================\n   SLOT FINDER\n   ========================================================= */\n\nfunction findAvailableSlots(\n    date,\n    start,\n    end,\n    duration,\n    occupied\n){\n\n    const slots=[];\n\n    const blocks =\n        occupied[date] || [];\n\n\n    /*\n       Use 15-minute granularity.\n    */\n\n    for(\n        let t=start;\n        t+duration<=end;\n        t+=15\n    ){\n\n        const candidateEnd =\n            t+duration;\n\n\n        const conflict =\n            blocks.some(block =>\n\n                t < block.end &&\n                candidateEnd > block.start\n\n            );\n\n\n        if(!conflict){\n\n            slots.push({\n\n                start:t,\n                end:candidateEnd\n\n            });\n\n        }\n\n    }\n\n\n    return slots;\n\n}\n\n\n/* =========================================================\n   OCCUPIED BLOCKS\n   ========================================================= */\n\nfunction addOccupied(\n    occupied,\n    date,\n    start,\n    end\n){\n\n    if(!occupied[date])\n        occupied[date]=[];\n\n    occupied[date].push({\n\n        start,\n        end\n\n    });\n\n}\n\n\n/* =========================================================\n   CALENDAR EVENTS\n   ========================================================= */\n\nfunction getCalendarEvents(){\n\n    return activities\n        .filter(a => a.scheduled && a.date && a.start)\n        .map(a=>{\n\n            const start =\n                `${a.date}T${a.start}`;\n\n            const endDate =\n                new Date(start);\n\n            endDate.setMinutes(\n                endDate.getMinutes()+a.duration\n            );\n\n\n            return {\n\n                id:a.id,\n\n                title:\n                    `${priorityIcon(a.priority)} ${a.name}`,\n\n                start,\n\n                end:\n                    toLocalDateTime(endDate),\n\n                classNames:\n                    a.completed\n                    ? [\"completed-event\"]\n                    : [],\n\n                extendedProps:{\n\n                    activityId:a.id\n\n                }\n\n            };\n\n        });\n\n}\n\n\n/* =========================================================\n   REFRESH CALENDAR\n   ========================================================= */\n\nfunction refreshCalendar(){\n\n    if(!calendar)return;\n\n    calendar.removeAllEvents();\n\n    calendar.addEventSource(\n        getCalendarEvents()\n    );\n\n}\n\n\n/* =========================================================\n   ACTIVITY LIST\n   ========================================================= */\n\nfunction renderActivityList(){\n\n    const container =\n        document.getElementById(\"activityList\");\n\n    const filter =\n        document.getElementById(\"filterPriority\").value;\n\n\n    let filtered =\n        activities.filter(a =>\n            filter===\"all\" ||\n            a.priority===filter\n        );\n\n\n    if(!filtered.length){\n\n        container.innerHTML =\n            `<div style=\"color:var(--muted)\">\n                No activities found.\n            <\/div>`;\n\n        return;\n\n    }\n\n\n    filtered.sort((a,b)=>{\n\n        const order={\n            urgent:4,\n            high:3,\n            medium:2,\n            low:1\n        };\n\n        return order[b.priority]-order[a.priority];\n\n    });\n\n\n    container.innerHTML =\n        filtered.map(a=>{\n\n            const status =\n                a.completed\n                ? \"Completed\"\n                : a.scheduled\n                ? `${formatDate(a.date)} • ${formatDisplayTime(a.start)}`\n                : \"Not scheduled\";\n\n\n            return `\n\n            <div class=\"activity-card\n                ${a.completed ? \"completed\":\"\"}\">\n\n                <div\n                    class=\"activity-dot\"\n                    style=\"background:${priorityColor(a.priority)}\">\n                <\/div>\n\n                <div>\n\n                    <div class=\"activity-name\">\n                        ${escapeHTML(a.name)}\n                    <\/div>\n\n                    <div class=\"activity-meta\">\n\n                        <span class=\"priority ${a.priority}\">\n                            ${capitalize(a.priority)}\n                        <\/span>\n\n                        &nbsp; • &nbsp;\n\n                        ${a.duration} min\n\n                        &nbsp; • &nbsp;\n\n                        ${status}\n\n                    <\/div>\n\n                <\/div>\n\n                <div class=\"card-actions\">\n\n                    <button\n                        class=\"icon-btn\"\n                        onclick=\"toggleComplete('${a.id}')\"\n                        title=\"Complete\">\n                        ${a.completed ? \"↩\":\"✓\"}\n                    <\/button>\n\n                    <button\n                        class=\"icon-btn\"\n                        onclick=\"openEdit('${a.id}')\">\n                        ✎\n                    <\/button>\n\n                    <button\n                        class=\"icon-btn\"\n                        onclick=\"deleteActivity('${a.id}')\">\n                        ×\n                    <\/button>\n\n                <\/div>\n\n            <\/div>\n\n            `;\n\n        }).join(\"\");\n\n}\n\n\n/* =========================================================\n   EDIT\n   ========================================================= */\n\nfunction openEdit(id){\n\n    const a =\n        activities.find(x=>x.id===id);\n\n    if(!a)return;\n\n\n    document.getElementById(\"editId\").value=a.id;\n    document.getElementById(\"editName\").value=a.name;\n    document.getElementById(\"editDate\").value=a.date || a.rangeStart;\n    document.getElementById(\"editStart\").value=a.start || a.preferredStart;\n    document.getElementById(\"editDuration\").value=a.duration;\n    document.getElementById(\"editPriority\").value=a.priority;\n\n\n    document\n        .getElementById(\"editModal\")\n        .classList.add(\"show\");\n\n}\n\n\nfunction closeModal(){\n\n    document\n        .getElementById(\"editModal\")\n        .classList.remove(\"show\");\n\n}\n\n\nfunction saveEdit(){\n\n    const id =\n        document.getElementById(\"editId\").value;\n\n    const a =\n        activities.find(x=>x.id===id);\n\n    if(!a)return;\n\n\n    a.name =\n        document.getElementById(\"editName\").value.trim();\n\n    a.date =\n        document.getElementById(\"editDate\").value;\n\n    a.start =\n        document.getElementById(\"editStart\").value;\n\n    a.duration =\n        parseInt(\n            document.getElementById(\"editDuration\").value\n        );\n\n    a.priority =\n        document.getElementById(\"editPriority\").value;\n\n    a.scheduled=true;\n\n\n    closeModal();\n\n    saveData();\n\n    refreshCalendar();\n\n    updateUI();\n\n    showToast(\"Activity updated\");\n\n}\n\n\n/* =========================================================\n   COMPLETE\n   ========================================================= */\n\nfunction toggleComplete(id){\n\n    const a =\n        activities.find(x=>x.id===id);\n\n    if(!a)return;\n\n    a.completed=!a.completed;\n\n    saveData();\n\n    refreshCalendar();\n\n    updateUI();\n\n}\n\n\n/* =========================================================\n   DELETE\n   ========================================================= */\n\nfunction deleteActivity(id){\n\n    if(!confirm(\"Delete this activity?\"))\n        return;\n\n\n    activities =\n        activities.filter(a=>a.id!==id);\n\n\n    saveData();\n\n    refreshCalendar();\n\n    updateUI();\n\n    showToast(\"Activity deleted\");\n\n}\n\n\n/* =========================================================\n   CLEAR EVERYTHING\n   ========================================================= */\n\nfunction clearAll(){\n\n    if(!activities.length)return;\n\n    if(!confirm(\n        \"Delete all activities?\"\n    ))return;\n\n\n    activities=[];\n\n    saveData();\n\n    refreshCalendar();\n\n    updateUI();\n\n    showToast(\"All activities cleared\");\n\n}\n\n\n/* =========================================================\n   UI\n   ========================================================= */\n\nfunction updateUI(){\n\n    document.getElementById(\"totalStat\").textContent =\n        activities.length;\n\n\n    document.getElementById(\"pendingStat\").textContent =\n        activities.filter(a=>!a.completed).length;\n\n\n    document.getElementById(\"completedStat\").textContent =\n        activities.filter(a=>a.completed).length;\n\n\n    const totalMinutes =\n        activities\n            .filter(a=>a.scheduled)\n            .reduce(\n                (sum,a)=>sum+a.duration,\n                0\n            );\n\n\n    document.getElementById(\"hoursStat\").textContent =\n        `${(totalMinutes/60).toFixed(1)}h`;\n\n\n    renderActivityList();\n\n}\n\n\n/* =========================================================\n   STORAGE\n   ========================================================= */\n\nfunction saveData(){\n\n    localStorage.setItem(\n        \"smartSchedulerActivities\",\n        JSON.stringify(activities)\n    );\n\n}\n\n\n/* =========================================================\n   EXPORT\n   ========================================================= */\n\nfunction exportData(){\n\n    const blob =\n        new Blob(\n            [\n                JSON.stringify(\n                    activities,\n                    null,\n                    2\n                )\n            ],\n            {\n                type:\"application/json\"\n            }\n        );\n\n\n    const url =\n        URL.createObjectURL(blob);\n\n\n    const a =\n        document.createElement(\"a\");\n\n    a.href=url;\n\n    a.download=\n        \"smart-schedule.json\";\n\n    a.click();\n\n    URL.revokeObjectURL(url);\n\n}\n\n\n/* =========================================================\n   IMPORT\n   ========================================================= */\n\nfunction importData(event){\n\n    const file =\n        event.target.files[0];\n\n    if(!file)return;\n\n\n    const reader =\n        new FileReader();\n\n\n    reader.onload=function(e){\n\n        try{\n\n            const data =\n                JSON.parse(e.target.result);\n\n\n            if(!Array.isArray(data))\n                throw new Error();\n\n\n            activities=data;\n\n            saveData();\n\n            refreshCalendar();\n\n            updateUI();\n\n            showToast(\"Schedule imported\");\n\n        }catch{\n\n            showToast(\n                \"Invalid schedule file\"\n            );\n\n        }\n\n    };\n\n\n    reader.readAsText(file);\n\n}\n\n\n/* =========================================================\n   FORM\n   ========================================================= */\n\ndocument\n    .getElementById(\"duration\")\n    .addEventListener(\n        \"change\",\n        function(){\n\n            document\n                .getElementById(\"customDurationBox\")\n                .style.display =\n                    this.value===\"custom\"\n                    ? \"block\"\n                    : \"none\";\n\n        }\n    );\n\n\nfunction clearForm(){\n\n    document.getElementById(\"activityName\").value=\"\";\n\n    document.getElementById(\"duration\").value=\"60\";\n\n    document.getElementById(\"priority\").value=\"medium\";\n\n}\n\n\n/* =========================================================\n   DATE / TIME HELPERS\n   ========================================================= */\n\nfunction parseDate(str){\n\n    const [y,m,d] =\n        str.split(\"-\").map(Number);\n\n    return new Date(\n        y,\n        m-1,\n        d\n    );\n\n}\n\n\nfunction toISODate(date){\n\n    const y =\n        date.getFullYear();\n\n    const m =\n        String(date.getMonth()+1)\n            .padStart(2,\"0\");\n\n    const d =\n        String(date.getDate())\n            .padStart(2,\"0\");\n\n\n    return `${y}-${m}-${d}`;\n\n}\n\n\nfunction minutesToTime(minutes){\n\n    const h =\n        Math.floor(minutes/60);\n\n    const m =\n        minutes%60;\n\n\n    return `${String(h).padStart(2,\"0\")}:${String(m).padStart(2,\"0\")}`;\n\n}\n\n\nfunction timeToMinutes(time){\n\n    const [h,m] =\n        time.split(\":\").map(Number);\n\n    return h*60+m;\n\n}\n\n\nfunction formatTime(date){\n\n    return `${String(date.getHours()).padStart(2,\"0\")}:${String(date.getMinutes()).padStart(2,\"0\")}`;\n\n}\n\n\nfunction toLocalDateTime(date){\n\n    return `${toISODate(date)}T${formatTime(date)}`;\n\n}\n\n\nfunction formatDate(date){\n\n    if(!date)return \"\";\n\n    return new Date(date+\"T00:00:00\")\n        .toLocaleDateString(\n            undefined,\n            {\n                weekday:\"short\",\n                month:\"short\",\n                day:\"numeric\"\n            }\n        );\n\n}\n\n\nfunction formatDisplayTime(time){\n\n    if(!time)return \"\";\n\n    const [h,m] =\n        time.split(\":\").map(Number);\n\n    const suffix =\n        h>=12 ? \"PM\":\"AM\";\n\n    const hour =\n        h%12 || 12;\n\n    return `${hour}:${String(m).padStart(2,\"0\")} ${suffix}`;\n\n}\n\n\n/* =========================================================\n   VISUAL HELPERS\n   ========================================================= */\n\nfunction priorityColor(priority){\n\n    return {\n\n        low:\"#3ddc97\",\n        medium:\"#ffc857\",\n        high:\"#ff9b70\",\n        urgent:\"#ff6b6b\"\n\n    }[priority];\n\n}\n\n\nfunction priorityIcon(priority){\n\n    return {\n\n        low:\"●\",\n        medium:\"◆\",\n        high:\"▲\",\n        urgent:\"!\"\n\n    }[priority];\n\n}\n\n\nfunction capitalize(text){\n\n    return text.charAt(0).toUpperCase()+text.slice(1);\n\n}\n\n\nfunction escapeHTML(text){\n\n    return text\n        .replace(/&/g,\"&amp;\")\n        .replace(/<\/g,\"&lt;\")\n        .replace(/>/g,\"&gt;\")\n        .replace(/\"/g,\"&quot;\")\n        .replace(/'/g,\"&#039;\");\n\n}\n\n\n/* =========================================================\n   TODAY\n   ========================================================= */\n\nfunction todayView(){\n\n    calendar.today();\n\n    calendar.changeView(\"timeGridDay\");\n\n}\n\n\n/* =========================================================\n   THEME\n   ========================================================= */\n\nfunction toggleTheme(){\n\n    const light =\n        document.body.dataset.theme===\"light\";\n\n\n    if(light){\n\n        document.body.dataset.theme=\"\";\n\n        document.documentElement.style\n            .setProperty(\"--bg\",\"#0b1020\");\n\n        document.documentElement.style\n            .setProperty(\"--panel\",\"#121a2d\");\n\n        document.documentElement.style\n            .setProperty(\"--panel2\",\"#18223a\");\n\n        document.documentElement.style\n            .setProperty(\"--text\",\"#eef3ff\");\n\n        document.documentElement.style\n            .setProperty(\"--muted\",\"#9ba8c7\");\n\n    }else{\n\n        document.body.dataset.theme=\"light\";\n\n        document.documentElement.style\n            .setProperty(\"--bg\",\"#f4f7fb\");\n\n        document.documentElement.style\n            .setProperty(\"--panel\",\"#ffffff\");\n\n        document.documentElement.style\n            .setProperty(\"--panel2\",\"#f2f5fa\");\n\n        document.documentElement.style\n            .setProperty(\"--text\",\"#172033\");\n\n        document.documentElement.style\n            .setProperty(\"--muted\",\"#667085\");\n\n    }\n\n}\n\n\n/* =========================================================\n   TOAST\n   ========================================================= */\n\nlet toastTimer;\n\nfunction showToast(message){\n\n    const toast =\n        document.getElementById(\"toast\");\n\n    toast.textContent=message;\n\n    toast.classList.add(\"show\");\n\n\n    clearTimeout(toastTimer);\n\n\n    toastTimer =\n        setTimeout(\n            ()=>{\n                toast.classList.remove(\"show\");\n            },\n            3000\n        );\n\n}\n\n<\/script>\n\n<\/body>\n<\/html>";
const nutritionCode = "<!DOCTYPE html>\n<html lang=\"en\">\n\n<head>\n\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\n<title>Smart Food & Nutrition Analyzer<\/title>\n\n<style>\n\n* {\n    box-sizing: border-box;\n    font-family: Arial, sans-serif;\n}\n\nbody {\n    margin: 0;\n    background: #f4f7f5;\n    color: #222;\n}\n\nheader {\n    background: #176b48;\n    color: white;\n    text-align: center;\n    padding: 30px 15px;\n}\n\nheader h1 {\n    margin: 0;\n    font-size: 30px;\n}\n\nheader p {\n    margin-top: 8px;\n}\n\n.container {\n    max-width: 1200px;\n    margin: 25px auto;\n    padding: 0 15px;\n}\n\n.card {\n    background: white;\n    padding: 22px;\n    margin-bottom: 20px;\n    border-radius: 14px;\n    box-shadow: 0 3px 14px rgba(0,0,0,0.08);\n}\n\nh2 {\n    color: #176b48;\n    margin-top: 0;\n}\n\n.form-grid {\n    display: grid;\n    grid-template-columns:\n        repeat(auto-fit, minmax(190px, 1fr));\n    gap: 14px;\n}\n\nlabel {\n    display: block;\n    margin-bottom: 6px;\n    font-weight: bold;\n}\n\ninput,\nselect,\nbutton {\n    width: 100%;\n    padding: 12px;\n    border-radius: 8px;\n    border: 1px solid #ccc;\n    font-size: 15px;\n}\n\nbutton {\n    cursor: pointer;\n    border: none;\n    font-weight: bold;\n}\n\n.search-btn {\n    background: #176b48;\n    color: white;\n}\n\n.search-btn:hover {\n    background: #105438;\n}\n\n.clear-btn {\n    background: #d9534f;\n    color: white;\n}\n\n.export-btn {\n    background: #2878c8;\n    color: white;\n}\n\n.status {\n    margin-top: 15px;\n    padding: 12px;\n    background: #eef5f1;\n    border-radius: 8px;\n}\n\n.results {\n    margin-top: 15px;\n}\n\n.food-result {\n    padding: 15px;\n    margin: 8px 0;\n    border: 1px solid #ddd;\n    border-radius: 9px;\n    cursor: pointer;\n    transition: 0.2s;\n}\n\n.food-result:hover {\n    background: #edf7f1;\n    border-color: #176b48;\n}\n\n.food-result strong {\n    color: #176b48;\n}\n\n.small {\n    font-size: 12px;\n    color: #666;\n}\n\ntable {\n    width: 100%;\n    border-collapse: collapse;\n    margin-top: 15px;\n}\n\nth,\ntd {\n    padding: 10px;\n    border-bottom: 1px solid #ddd;\n    text-align: center;\n}\n\nth {\n    background: #e6f1ea;\n}\n\n.remove-btn {\n    background: #e74c3c;\n    color: white;\n    width: auto;\n    padding: 7px 10px;\n}\n\n.nutrition-grid {\n    display: grid;\n    grid-template-columns:\n        repeat(auto-fit, minmax(140px, 1fr));\n    gap: 12px;\n}\n\n.nutrition-box {\n    background: #eef7f1;\n    padding: 16px;\n    border-radius: 10px;\n    text-align: center;\n}\n\n.nutrition-box strong {\n    display: block;\n    color: #176b48;\n    font-size: 21px;\n    margin-bottom: 5px;\n}\n\n.health-card {\n    padding: 18px;\n    margin-bottom: 12px;\n    border-radius: 10px;\n}\n\n.healthy {\n    background: #e8f7ed;\n    border-left: 5px solid #2e8b57;\n}\n\n.moderate {\n    background: #fff7df;\n    border-left: 5px solid #e0a400;\n}\n\n.limit {\n    background: #ffe9e7;\n    border-left: 5px solid #d9534f;\n}\n\n.nutrient-table {\n    width: 100%;\n    margin-top: 12px;\n}\n\n.nutrient-table td:first-child {\n    font-weight: bold;\n    text-align: left;\n}\n\n.nutrient-table td:last-child {\n    text-align: right;\n}\n\n.loading {\n    text-align: center;\n    padding: 15px;\n}\n\n@media(max-width: 700px) {\n\n    table {\n        font-size: 12px;\n    }\n\n    th,\n    td {\n        padding: 6px;\n    }\n\n}\n\n<\/style>\n\n<\/head>\n\n\n<body>\n\n\n<header>\n\n    <h1>🥗 Smart Food & Nutrition Analyzer<\/h1>\n\n    <p>\n        Search food composition and analyze nutrients\n    <\/p>\n\n<\/header>\n\n\n<div class=\"container\">\n\n\n<!-- =====================================================\n     INPUT\n====================================================== -->\n\n<div class=\"card\">\n\n    <h2>1. Enter Food Information<\/h2>\n\n    <div class=\"form-grid\">\n\n\n        <div>\n\n            <label>Food Category<\/label>\n\n            <select id=\"category\">\n\n                <option value=\"Food\">Food<\/option>\n\n                <option value=\"Fruit\">Fruit<\/option>\n\n                <option value=\"Vegetable\">\n                    Vegetable\n                <\/option>\n\n                <option value=\"Meal\">Meal<\/option>\n\n            <\/select>\n\n        <\/div>\n\n\n        <div>\n\n            <label>Food Name<\/label>\n\n            <input\n                type=\"text\"\n                id=\"foodName\"\n                autocomplete=\"off\"\n            >\n\n        <\/div>\n\n\n        <div>\n\n            <label>Amount (grams)<\/label>\n\n            <input\n                type=\"number\"\n                id=\"amount\"\n                min=\"1\"\n                step=\"1\"\n            >\n\n        <\/div>\n\n\n        <div style=\"display:flex;align-items:end\">\n\n            <button\n                class=\"search-btn\"\n                onclick=\"searchFood()\"\n            >\n\n                🔎 Search Food\n\n            <\/button>\n\n        <\/div>\n\n    <\/div>\n\n\n    <div id=\"status\" class=\"status\">\n\n        Enter the food information and search.\n\n    <\/div>\n\n\n    <div id=\"results\" class=\"results\"><\/div>\n\n<\/div>\n\n\n\n<!-- =====================================================\n     SELECTED FOODS\n====================================================== -->\n\n<div class=\"card\">\n\n    <h2>2. Selected Foods<\/h2>\n\n    <div id=\"foodTable\">\n\n        No foods selected.\n\n    <\/div>\n\n<\/div>\n\n\n\n<!-- =====================================================\n     TOTAL NUTRITION\n====================================================== -->\n\n<div class=\"card\">\n\n    <h2>3. Total Nutrients<\/h2>\n\n    <div class=\"nutrition-grid\">\n\n\n        <div class=\"nutrition-box\">\n\n            <strong id=\"totalCalories\">\n                0\n            <\/strong>\n\n            Calories\n\n        <\/div>\n\n\n        <div class=\"nutrition-box\">\n\n            <strong id=\"totalProtein\">\n                0 g\n            <\/strong>\n\n            Protein\n\n        <\/div>\n\n\n        <div class=\"nutrition-box\">\n\n            <strong id=\"totalCarbs\">\n                0 g\n            <\/strong>\n\n            Carbohydrates\n\n        <\/div>\n\n\n        <div class=\"nutrition-box\">\n\n            <strong id=\"totalFat\">\n                0 g\n            <\/strong>\n\n            Fat\n\n        <\/div>\n\n\n        <div class=\"nutrition-box\">\n\n            <strong id=\"totalFiber\">\n                0 g\n            <\/strong>\n\n            Fibre\n\n        <\/div>\n\n\n        <div class=\"nutrition-box\">\n\n            <strong id=\"totalSugar\">\n                0 g\n            <\/strong>\n\n            Sugar\n\n        <\/div>\n\n\n        <div class=\"nutrition-box\">\n\n            <strong id=\"totalSodium\">\n                0 mg\n            <\/strong>\n\n            Sodium\n\n        <\/div>\n\n\n        <div class=\"nutrition-box\">\n\n            <strong id=\"totalCalcium\">\n                0 mg\n            <\/strong>\n\n            Calcium\n\n        <\/div>\n\n\n        <div class=\"nutrition-box\">\n\n            <strong id=\"totalIron\">\n                0 mg\n            <\/strong>\n\n            Iron\n\n        <\/div>\n\n\n        <div class=\"nutrition-box\">\n\n            <strong id=\"totalPotassium\">\n                0 mg\n            <\/strong>\n\n            Potassium\n\n        <\/div>\n\n    <\/div>\n\n<\/div>\n\n\n\n<!-- =====================================================\n     FOOD ANALYSIS\n====================================================== -->\n\n<div class=\"card\">\n\n    <h2>4. Food Health Analysis<\/h2>\n\n    <div id=\"healthAnalysis\">\n\n        Add a food to receive an analysis.\n\n    <\/div>\n\n<\/div>\n\n\n\n<!-- =====================================================\n     CONTROLS\n====================================================== -->\n\n<div class=\"card\">\n\n    <div class=\"form-grid\">\n\n        <button\n            class=\"export-btn\"\n            onclick=\"downloadCSV()\"\n        >\n\n            📊 Export CSV\n\n        <\/button>\n\n\n        <button\n            class=\"clear-btn\"\n            onclick=\"clearAll()\"\n        >\n\n            🗑 Clear All\n\n        <\/button>\n\n    <\/div>\n\n<\/div>\n\n\n\n<!-- =====================================================\n     DATA SOURCE\n====================================================== -->\n\n<div class=\"card\">\n\n    <p class=\"small\">\n\n        Nutritional data are retrieved from\n        USDA FoodData Central.\n\n        Values can vary according to the exact food,\n        preparation method and database record.\n\n        The health classification and portion guidance\n        are general educational estimates and are not\n        personalized medical or dietary advice.\n\n    <\/p>\n\n<\/div>\n\n\n<\/div>\n\n\n\n<script>\n\n\n/*\n=========================================================\nUSDA FOODDATA CENTRAL API\n=========================================================\n\nReplace DEMO_KEY with your own API key for a proper\nproject.\n\nUSDA provides:\n    /foods/search\n    /food/{fdcId}\n\n=========================================================\n*/\n\nconst API_KEY = \"DEMO_KEY\";\n\nconst SEARCH_URL =\n    \"https://api.nal.usda.gov/fdc/v1/foods/search\";\n\nconst DETAIL_URL =\n    \"https://api.nal.usda.gov/fdc/v1/food/\";\n\n\n\n/*\n=========================================================\nSELECTED FOODS\n=========================================================\n*/\n\nlet selectedFoods = [];\n\n\n\n/*\n=========================================================\nSEARCH FOOD\n=========================================================\n*/\n\nasync function searchFood() {\n\n    const name =\n        document.getElementById(\"foodName\")\n        .value\n        .trim();\n\n    const amount =\n        Number(\n            document.getElementById(\"amount\")\n            .value\n        );\n\n\n    if (!name) {\n\n        alert(\"Please enter a food name.\");\n\n        return;\n\n    }\n\n\n    if (!amount || amount <= 0) {\n\n        alert(\"Please enter a valid amount.\");\n\n        return;\n\n    }\n\n\n    const status =\n        document.getElementById(\"status\");\n\n    const results =\n        document.getElementById(\"results\");\n\n\n    status.innerHTML =\n        \"🔎 Searching FoodData Central...\";\n\n\n    results.innerHTML =\n        '<div class=\"loading\">Searching...<\/div>';\n\n\n    try {\n\n\n        const url =\n            SEARCH_URL +\n            \"?api_key=\" +\n            API_KEY +\n            \"&query=\" +\n            encodeURIComponent(name) +\n            \"&pageSize=10\";\n\n\n        const response =\n            await fetch(url);\n\n\n        if (!response.ok) {\n\n            throw new Error(\n                \"Search request failed\"\n            );\n\n        }\n\n\n        const data =\n            await response.json();\n\n\n        if (\n            !data.foods ||\n            data.foods.length === 0\n        ) {\n\n            status.innerHTML =\n                \"No matching food was found.\";\n\n            results.innerHTML = \"\";\n\n            return;\n\n        }\n\n\n        status.innerHTML =\n            \"Select the food record that best matches your food:\";\n\n\n        showResults(\n            data.foods,\n            amount\n        );\n\n\n    } catch(error) {\n\n        console.error(error);\n\n\n        status.innerHTML =\n            \"Unable to connect to the food database.\";\n\n\n        results.innerHTML = `\n\n            <div class=\"health-card moderate\">\n\n                Check your internet connection\n                and USDA API key.\n\n            <\/div>\n\n        `;\n\n    }\n\n}\n\n\n\n/*\n=========================================================\nSHOW SEARCH RESULTS\n=========================================================\n*/\n\nfunction showResults(\n    foods,\n    amount\n) {\n\n    const results =\n        document.getElementById(\"results\");\n\n\n    results.innerHTML = \"\";\n\n\n    foods.forEach(food => {\n\n\n        const div =\n            document.createElement(\"div\");\n\n\n        div.className =\n            \"food-result\";\n\n\n        div.innerHTML = `\n\n            <strong>\n                ${escapeHTML(food.description)}\n            <\/strong>\n\n            <br>\n\n            <span class=\"small\">\n\n                ${escapeHTML(\n                    food.dataType || \"Food\"\n                )}\n\n                &nbsp; | &nbsp;\n\n                FDC ID:\n                ${food.fdcId}\n\n            <\/span>\n\n        `;\n\n\n        div.onclick = () => {\n\n            getFoodDetails(\n                food.fdcId,\n                food.description,\n                amount\n            );\n\n        };\n\n\n        results.appendChild(div);\n\n    });\n\n}\n\n\n\n/*\n=========================================================\nGET EXACT FOOD DETAILS\n=========================================================\n\nThis makes the program more precise by fetching\nthe selected food record rather than relying only\non the search result.\n\n=========================================================\n*/\n\nasync function getFoodDetails(\n    fdcId,\n    description,\n    amount\n) {\n\n    const status =\n        document.getElementById(\"status\");\n\n    const results =\n        document.getElementById(\"results\");\n\n\n    status.innerHTML =\n        \"📊 Loading complete nutrient information...\";\n\n\n    results.innerHTML =\n        '<div class=\"loading\">Loading...<\/div>';\n\n\n    try {\n\n\n        const url =\n            DETAIL_URL +\n            fdcId +\n            \"?api_key=\" +\n            API_KEY;\n\n\n        const response =\n            await fetch(url);\n\n\n        if (!response.ok) {\n\n            throw new Error(\n                \"Food details request failed\"\n            );\n\n        }\n\n\n        const food =\n            await response.json();\n\n\n        const nutrients =\n            extractNutrients(food);\n\n\n        const category =\n            document.getElementById(\"category\")\n            .value;\n\n\n        selectedFoods.push({\n\n            id: fdcId,\n\n            name: description,\n\n            category: category,\n\n            amount: amount,\n\n            nutrients: nutrients\n\n        });\n\n\n        status.innerHTML =\n            \"Food successfully added.\";\n\n\n        results.innerHTML = \"\";\n\n\n        document.getElementById(\"foodName\")\n            .value = \"\";\n\n\n        document.getElementById(\"amount\")\n            .value = \"\";\n\n\n        updateEverything();\n\n\n    } catch(error) {\n\n        console.error(error);\n\n\n        status.innerHTML =\n            \"Could not load the complete nutrient information.\";\n\n\n        results.innerHTML = \"\";\n\n    }\n\n}\n\n\n\n/*\n=========================================================\nNUTRIENT EXTRACTION\n=========================================================\n*/\n\nfunction extractNutrients(food) {\n\n\n    const n = {\n\n        calories: 0,\n\n        protein: 0,\n\n        carbs: 0,\n\n        fat: 0,\n\n        fiber: 0,\n\n        sugar: 0,\n\n        sodium: 0,\n\n        calcium: 0,\n\n        iron: 0,\n\n        potassium: 0,\n\n        magnesium: 0,\n\n        phosphorus: 0,\n\n        zinc: 0,\n\n        vitaminC: 0,\n\n        vitaminA: 0\n\n    };\n\n\n    if (!food.foodNutrients) {\n\n        return n;\n\n    }\n\n\n    food.foodNutrients.forEach(item => {\n\n\n        const name =\n            (\n                item.nutrient\n                ?.name ||\n                item.nutrientName ||\n                \"\"\n            ).toLowerCase();\n\n\n        let value =\n            Number(\n                item.amount ??\n                item.value ??\n                0\n            );\n\n\n        /*\n        Convert energy to kcal\n        */\n\n        if (\n            name.includes(\"energy\")\n        ) {\n\n            if (\n                item.nutrient?.unitName ===\n                \"kJ\"\n            ) {\n\n                value =\n                    value / 4.184;\n\n            }\n\n            n.calories =\n                value;\n\n        }\n\n\n        else if (\n            name === \"protein\"\n        ) {\n\n            n.protein =\n                value;\n\n        }\n\n\n        else if (\n            name.includes(\"carbohydrate\")\n        ) {\n\n            n.carbs =\n                value;\n\n        }\n\n\n        else if (\n            name.includes(\"total lipid\")\n            ||\n            name === \"fat\"\n        ) {\n\n            n.fat =\n                value;\n\n        }\n\n\n        else if (\n            name.includes(\"fiber\")\n        ) {\n\n            n.fiber =\n                value;\n\n        }\n\n\n        else if (\n            name.includes(\"total sugars\")\n        ) {\n\n            n.sugar =\n                value;\n\n        }\n\n\n        else if (\n            name.includes(\"sodium\")\n        ) {\n\n            n.sodium =\n                value;\n\n        }\n\n\n        else if (\n            name.includes(\"calcium\")\n        ) {\n\n            n.calcium =\n                value;\n\n        }\n\n\n        else if (\n            name.includes(\"iron\")\n        ) {\n\n            n.iron =\n                value;\n\n        }\n\n\n        else if (\n            name.includes(\"potassium\")\n        ) {\n\n            n.potassium =\n                value;\n\n        }\n\n\n        else if (\n            name.includes(\"magnesium\")\n        ) {\n\n            n.magnesium =\n                value;\n\n        }\n\n\n        else if (\n            name.includes(\"phosphorus\")\n        ) {\n\n            n.phosphorus =\n                value;\n\n        }\n\n\n        else if (\n            name.includes(\"zinc\")\n        ) {\n\n            n.zinc =\n                value;\n\n        }\n\n\n        else if (\n            name.includes(\"vitamin c\")\n        ) {\n\n            n.vitaminC =\n                value;\n\n        }\n\n\n        else if (\n            name.includes(\"vitamin a\")\n        ) {\n\n            n.vitaminA =\n                value;\n\n        }\n\n    });\n\n\n    return n;\n\n}\n\n\n\n/*\n=========================================================\nDISPLAY SELECTED FOOD TABLE\n=========================================================\n*/\n\nfunction displayTable() {\n\n\n    const container =\n        document.getElementById(\"foodTable\");\n\n\n    if (\n        selectedFoods.length === 0\n    ) {\n\n        container.innerHTML =\n            \"No foods selected.\";\n\n        return;\n\n    }\n\n\n    let html = `\n\n        <table>\n\n            <tr>\n\n                <th>Food<\/th>\n\n                <th>Category<\/th>\n\n                <th>Amount<\/th>\n\n                <th>Calories<\/th>\n\n                <th>Protein<\/th>\n\n                <th>Carbs<\/th>\n\n                <th>Fat<\/th>\n\n                <th>Fibre<\/th>\n\n                <th>Action<\/th>\n\n            <\/tr>\n\n    `;\n\n\n    selectedFoods.forEach(\n        (item, index) => {\n\n\n        const factor =\n            item.amount / 100;\n\n\n        const n =\n            item.nutrients;\n\n\n        html += `\n\n            <tr>\n\n                <td>\n                    ${escapeHTML(item.name)}\n                <\/td>\n\n                <td>\n                    ${item.category}\n                <\/td>\n\n                <td>\n                    ${item.amount} g\n                <\/td>\n\n                <td>\n                    ${(\n                        n.calories *\n                        factor\n                    ).toFixed(1)}\n                <\/td>\n\n                <td>\n                    ${(\n                        n.protein *\n                        factor\n                    ).toFixed(1)} g\n                <\/td>\n\n                <td>\n                    ${(\n                        n.carbs *\n                        factor\n                    ).toFixed(1)} g\n                <\/td>\n\n                <td>\n                    ${(\n                        n.fat *\n                        factor\n                    ).toFixed(1)} g\n                <\/td>\n\n                <td>\n                    ${(\n                        n.fiber *\n                        factor\n                    ).toFixed(1)} g\n                <\/td>\n\n                <td>\n\n                    <button\n                        class=\"remove-btn\"\n                        onclick=\"removeFood(${index})\">\n\n                        Remove\n\n                    <\/button>\n\n                <\/td>\n\n            <\/tr>\n\n        `;\n\n    });\n\n\n    html += \"<\/table>\";\n\n\n    container.innerHTML =\n        html;\n\n}\n\n\n\n/*\n=========================================================\nCALCULATE TOTAL NUTRIENTS\n=========================================================\n*/\n\nfunction calculateTotals() {\n\n\n    const total = {\n\n        calories: 0,\n\n        protein: 0,\n\n        carbs: 0,\n\n        fat: 0,\n\n        fiber: 0,\n\n        sugar: 0,\n\n        sodium: 0,\n\n        calcium: 0,\n\n        iron: 0,\n\n        potassium: 0\n\n    };\n\n\n    selectedFoods.forEach(item => {\n\n\n        const factor =\n            item.amount / 100;\n\n\n        const n =\n            item.nutrients;\n\n\n        total.calories +=\n            n.calories * factor;\n\n        total.protein +=\n            n.protein * factor;\n\n        total.carbs +=\n            n.carbs * factor;\n\n        total.fat +=\n            n.fat * factor;\n\n        total.fiber +=\n            n.fiber * factor;\n\n        total.sugar +=\n            n.sugar * factor;\n\n        total.sodium +=\n            n.sodium * factor;\n\n        total.calcium +=\n            n.calcium * factor;\n\n        total.iron +=\n            n.iron * factor;\n\n        total.potassium +=\n            n.potassium * factor;\n\n    });\n\n\n    setText(\n        \"totalCalories\",\n        total.calories.toFixed(1)\n    );\n\n\n    setText(\n        \"totalProtein\",\n        total.protein.toFixed(1) + \" g\"\n    );\n\n\n    setText(\n        \"totalCarbs\",\n        total.carbs.toFixed(1) + \" g\"\n    );\n\n\n    setText(\n        \"totalFat\",\n        total.fat.toFixed(1) + \" g\"\n    );\n\n\n    setText(\n        \"totalFiber\",\n        total.fiber.toFixed(1) + \" g\"\n    );\n\n\n    setText(\n        \"totalSugar\",\n        total.sugar.toFixed(1) + \" g\"\n    );\n\n\n    setText(\n        \"totalSodium\",\n        total.sodium.toFixed(1) + \" mg\"\n    );\n\n\n    setText(\n        \"totalCalcium\",\n        total.calcium.toFixed(1) + \" mg\"\n    );\n\n\n    setText(\n        \"totalIron\",\n        total.iron.toFixed(1) + \" mg\"\n    );\n\n\n    setText(\n        \"totalPotassium\",\n        total.potassium.toFixed(1) + \" mg\"\n    );\n\n}\n\n\n\n/*\n=========================================================\nHEALTH ANALYSIS\n=========================================================\n*/\n\nfunction healthAnalysis() {\n\n\n    const box =\n        document.getElementById(\n            \"healthAnalysis\"\n        );\n\n\n    if (\n        selectedFoods.length === 0\n    ) {\n\n        box.innerHTML =\n            \"Add a food to receive an analysis.\";\n\n        return;\n\n    }\n\n\n    let html = \"\";\n\n\n    selectedFoods.forEach(item => {\n\n\n        const n =\n            item.nutrients;\n\n\n        const factor =\n            item.amount / 100;\n\n\n        const actual = {\n\n            calories:\n                n.calories * factor,\n\n            protein:\n                n.protein * factor,\n\n            carbs:\n                n.carbs * factor,\n\n            fat:\n                n.fat * factor,\n\n            fiber:\n                n.fiber * factor,\n\n            sugar:\n                n.sugar * factor,\n\n            sodium:\n                n.sodium * factor,\n\n            calcium:\n                n.calcium * factor,\n\n            iron:\n                n.iron * factor,\n\n            potassium:\n                n.potassium * factor\n\n        };\n\n\n        const result =\n            classifyFood(\n                item.category,\n                actual\n            );\n\n\n        html += `\n\n            <div class=\"health-card ${result.className}\">\n\n                <h3>\n                    ${escapeHTML(item.name)}\n                <\/h3>\n\n                <h3>\n                    ${result.label}\n                <\/h3>\n\n                <p>\n                    ${result.explanation}\n                <\/p>\n\n                <p>\n\n                    <strong>\n                        Amount entered:\n                    <\/strong>\n\n                    ${item.amount} g\n\n                <\/p>\n\n                <p>\n\n                    <strong>\n                        General portion guidance:\n                    <\/strong>\n\n                    ${result.portion}\n\n                <\/p>\n\n\n                <table class=\"nutrient-table\">\n\n                    <tr>\n                        <td>Calories<\/td>\n                        <td>\n                            ${actual.calories.toFixed(1)} kcal\n                        <\/td>\n                    <\/tr>\n\n                    <tr>\n                        <td>Protein<\/td>\n                        <td>\n                            ${actual.protein.toFixed(1)} g\n                        <\/td>\n                    <\/tr>\n\n                    <tr>\n                        <td>Carbohydrates<\/td>\n                        <td>\n                            ${actual.carbs.toFixed(1)} g\n                        <\/td>\n                    <\/tr>\n\n                    <tr>\n                        <td>Fat<\/td>\n                        <td>\n                            ${actual.fat.toFixed(1)} g\n                        <\/td>\n                    <\/tr>\n\n                    <tr>\n                        <td>Fibre<\/td>\n                        <td>\n                            ${actual.fiber.toFixed(1)} g\n                        <\/td>\n                    <\/tr>\n\n                    <tr>\n                        <td>Sugar<\/td>\n                        <td>\n                            ${actual.sugar.toFixed(1)} g\n                        <\/td>\n                    <\/tr>\n\n                    <tr>\n                        <td>Sodium<\/td>\n                        <td>\n                            ${actual.sodium.toFixed(1)} mg\n                        <\/td>\n                    <\/tr>\n\n                    <tr>\n                        <td>Calcium<\/td>\n                        <td>\n                            ${actual.calcium.toFixed(1)} mg\n                        <\/td>\n                    <\/tr>\n\n                    <tr>\n                        <td>Iron<\/td>\n                        <td>\n                            ${actual.iron.toFixed(1)} mg\n                        <\/td>\n                    <\/tr>\n\n                    <tr>\n                        <td>Potassium<\/td>\n                        <td>\n                            ${actual.potassium.toFixed(1)} mg\n                        <\/td>\n                    <\/tr>\n\n                <\/table>\n\n            <\/div>\n\n        `;\n\n    });\n\n\n    box.innerHTML =\n        html;\n\n}\n\n\n\n/*\n=========================================================\nFOOD CLASSIFICATION\n=========================================================\n\nThis is a GENERAL nutritional classification.\n\nIt does NOT prescribe a personal diet.\n\n=========================================================\n*/\n\nfunction classifyFood(\n    category,\n    n\n) {\n\n\n    /*\n    Fruits and vegetables\n    */\n\n    if (\n        category === \"Fruit\" ||\n        category === \"Vegetable\"\n    ) {\n\n\n        if (\n            n.fiber >= 2 &&\n            n.sodium < 500\n        ) {\n\n            return {\n\n                className: \"healthy\",\n\n                label:\n                    \"🟢 Generally nutrient-dense\",\n\n                explanation:\n                    \"This food provides useful nutrients and can generally be part of a balanced diet.\",\n\n                portion:\n                    category === \"Fruit\"\n                    ? \"A general serving is often around 80–150 g.\"\n                    : \"A general serving is often around 80–150 g.\"\n\n            };\n\n        }\n\n    }\n\n\n    /*\n    Meals\n    */\n\n    if (category === \"Meal\") {\n\n\n        if (\n            n.protein >= 8 &&\n            n.fiber >= 2 &&\n            n.sodium < 700\n        ) {\n\n            return {\n\n                className: \"healthy\",\n\n                label:\n                    \"🟢 Generally balanced\",\n\n                explanation:\n                    \"The selected meal has a useful combination of nutrients based on the available database information.\",\n\n                portion:\n                    \"Meal portions vary considerably. Use the amount entered as the serving being analyzed rather than a fixed daily target.\"\n\n            };\n\n        }\n\n\n        if (\n            n.sodium > 900 ||\n            n.sugar > 20\n        ) {\n\n            return {\n\n                className: \"limit\",\n\n                label:\n                    \"🔴 Better to limit\",\n\n                explanation:\n                    \"This particular meal is relatively high in sodium or sugar for the amount analyzed.\",\n\n                portion:\n                    \"Consider a smaller portion and balance the meal with less processed foods.\"\n\n            };\n\n        }\n\n    }\n\n\n    /*\n    General food classification\n    */\n\n    if (\n        n.protein >= 8 &&\n        n.fiber >= 2 &&\n        n.sodium < 700\n    ) {\n\n        return {\n\n            className: \"healthy\",\n\n            label:\n                \"🟢 Generally nutrient-dense\",\n\n            explanation:\n                \"This food provides useful amounts of protein and/or fibre without a high sodium value in the analyzed amount.\",\n\n            portion:\n                \"A moderate portion can generally fit into a balanced meal.\"\n\n        };\n\n    }\n\n\n    if (\n        n.sodium > 900 ||\n        n.sugar > 20\n    ) {\n\n        return {\n\n            className: \"limit\",\n\n            label:\n                \"🔴 Better to limit\",\n\n            explanation:\n                \"The analyzed amount is relatively high in sodium or sugar.\",\n\n            portion:\n                \"Consider a smaller portion and balance it with other nutrient-rich foods.\"\n\n        };\n\n    }\n\n\n    return {\n\n        className: \"moderate\",\n\n        label:\n            \"🟡 Moderate\",\n\n        explanation:\n            \"This food can fit into a balanced diet, but its overall nutritional profile suggests paying attention to portion size.\",\n\n        portion:\n            \"A moderate portion is a reasonable general approach.\"\n\n    };\n\n}\n\n\n\n/*\n=========================================================\nREMOVE FOOD\n=========================================================\n*/\n\nfunction removeFood(index) {\n\n    selectedFoods.splice(\n        index,\n        1\n    );\n\n    updateEverything();\n\n}\n\n\n\n/*\n=========================================================\nCSV EXPORT\n=========================================================\n*/\n\nfunction downloadCSV() {\n\n\n    if (\n        selectedFoods.length === 0\n    ) {\n\n        alert(\"No food data to export.\");\n\n        return;\n\n    }\n\n\n    let csv =\n        \"Food,Category,Amount(g),Calories(kcal),Protein(g),Carbohydrates(g),Fat(g),Fibre(g),Sugar(g),Sodium(mg),Calcium(mg),Iron(mg),Potassium(mg)\\n\";\n\n\n    selectedFoods.forEach(item => {\n\n\n        const n =\n            item.nutrients;\n\n\n        const factor =\n            item.amount / 100;\n\n\n        csv += [\n\n            `\"${item.name.replace(/\"/g,'\"\"')}\"`,\n\n            item.category,\n\n            item.amount,\n\n            (n.calories * factor).toFixed(2),\n\n            (n.protein * factor).toFixed(2),\n\n            (n.carbs * factor).toFixed(2),\n\n            (n.fat * factor).toFixed(2),\n\n            (n.fiber * factor).toFixed(2),\n\n            (n.sugar * factor).toFixed(2),\n\n            (n.sodium * factor).toFixed(2),\n\n            (n.calcium * factor).toFixed(2),\n\n            (n.iron * factor).toFixed(2),\n\n            (n.potassium * factor).toFixed(2)\n\n        ].join(\",\") + \"\\n\";\n\n    });\n\n\n    const blob =\n        new Blob(\n            [csv],\n            { type: \"text/csv\" }\n        );\n\n\n    const url =\n        URL.createObjectURL(blob);\n\n\n    const link =\n        document.createElement(\"a\");\n\n\n    link.href = url;\n\n    link.download =\n        \"food_nutrition_analysis.csv\";\n\n\n    link.click();\n\n\n    URL.revokeObjectURL(url);\n\n}\n\n\n\n/*\n=========================================================\nCLEAR ALL\n=========================================================\n*/\n\nfunction clearAll() {\n\n    selectedFoods = [];\n\n\n    document.getElementById(\"foodName\")\n        .value = \"\";\n\n\n    document.getElementById(\"amount\")\n        .value = \"\";\n\n\n    document.getElementById(\"results\")\n        .innerHTML = \"\";\n\n\n    document.getElementById(\"status\")\n        .innerHTML =\n        \"Enter the food information and search.\";\n\n\n    updateEverything();\n\n}\n\n\n\n/*\n=========================================================\nUPDATE EVERYTHING\n=========================================================\n*/\n\nfunction updateEverything() {\n\n    displayTable();\n\n    calculateTotals();\n\n    healthAnalysis();\n\n}\n\n\n\n/*\n=========================================================\nHELPER FUNCTIONS\n=========================================================\n*/\n\nfunction setText(id, value) {\n\n    document.getElementById(id)\n        .textContent = value;\n\n}\n\n\nfunction escapeHTML(text) {\n\n    const div =\n        document.createElement(\"div\");\n\n    div.textContent = text;\n\n    return div.innerHTML;\n\n}\n\n\n/*\n=========================================================\nINITIALIZE\n=========================================================\n*/\n\nupdateEverything();\n\n<\/script>\n\n<\/body>\n\n<\/html>\n\n";

function loadTools() {
    document.getElementById("schedulerFrame").srcdoc = schedulerCode;
    document.getElementById("nutritionFrame").srcdoc = nutritionCode;
}

function switchTool(panelId, button) {
    document.querySelectorAll(".hub-panel").forEach(panel => {
        panel.classList.toggle("active", panel.id === panelId);
    });

    document.querySelectorAll(".hub-tab").forEach(tab => {
        tab.classList.remove("active");
    });

    button.classList.add("active");
}

window.addEventListener("DOMContentLoaded", loadTools);
</script>
